            --border-color: #30363d;
            --success: #2ea043;
            --error: #f85149;
            --cve-bg: #1f2428;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 { margin: 0; color: var(--accent-color); }
        .controls { display: flex; gap: 10px; align-items: center; }
        
        button {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.2s;
        }
        button:hover { background-color: var(--border-color); }
        .btn-sync { background-color: var(--success); color: white; border: none; }
        .btn-sync:hover { background-color: #3fb950; }
        
        #sync-status { font-size: 0.9em; margin-left: 10px; }
        .status-ok { color: var(--success); }
        .status-err { color: var(--error); }
        
        .tabs { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; border-radius: 20px; }
        .tab.active { background-color: var(--accent-color); color: #000; border-color: var(--accent-color); font-weight: bold; }
        
        .search-container { margin-bottom: 20px; display: flex; gap: 10px; align-items: center;}
        .search-box {
            width: 100%;
            padding: 12px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .counter { font-size: 0.9em; color: #8b949e; white-space: nowrap; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); border-color: #8b949e; }
        .card h3 { margin: 0 0 8px 0; color: var(--accent-color); font-size: 1.1em; }
        .card .badge {
            display: inline-block;
            background: #238636;
            color: white;
            font-size: 0.7em;
            padding: 2px 6px;
            border-radius: 10px;
            margin-bottom: 10px;
            width: fit-content;
            margin-right: 4px;
        }
        .card p { margin: 0 0 16px 0; font-size: 0.85em; flex-grow: 1; color: #8b949e; }
        .card a {
            display: inline-block;
            text-align: center;
            background: #21262d;
            color: var(--accent-color);
            text-decoration: none;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            transition: 0.2s;
            font-size: 0.9em;
        }
        .card a:hover { background: #30363d; }

        /* CVE Correlator */
        .cve-panel {
            background: var(--cve-bg);
            border: 1px solid var(--accent-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .cve-panel h2 { margin-top: 0; color: var(--accent-color); }
        .cve-input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .cve-input-group input { flex-grow: 1; }
        .cve-links { display: flex; flex-wrap: wrap; gap: 10px; }
        .cve-links a {
            background: #21262d; border: 1px solid var(--border-color);
            color: #c9d1d9; padding: 10px 15px; border-radius: 6px; text-decoration: none;
        }
        .cve-links a:hover { background: var(--border-color); color: #fff; }
    </style>

            { name: "MXToolBox", url: "https://mxtoolbox.com", category: "daily", tags: ["dns", "email"], desc: "Fast, accurate network diagnostic and lookup tools." },
            { name: "FileSec", url: "https://filesec.io/", category: "daily", tags: ["extensions", "payloads"], desc: "Guide to attacker file extensions used in phishing and malware." },
            { name: "Exploit Database", url: "https://www.exploit-db.com/", category: "daily", tags: ["exploits", "cve"], desc: "CVE compliant archive of public exploits and corresponding vulnerable software." },
            { name: "CrackStation", url: "https://crackstation.net/", category: "daily", tags: ["hashes", "cracking"], desc: "Free password hash cracker using massive rainbow tables." },
            { name: "jwt.io", url: "https://jwt.io/", category: "daily", tags: ["jwt", "decoder"], desc: "Decode, verify and generate JWTs." },
            { name: "Regex101", url: "https://regex101.com/", category: "daily", tags: ["regex", "testing"], desc: "Regular expression tester with syntax highlighting." },
            { name: "BGPview", url: "https://bgpview.io/", category: "daily", tags: ["bgp", "asn"], desc: "BGP toolkit for ASN, IPv4/IPv6 prefixes routing information." },
            { name: "Draw.io", url: "https://app.diagrams.net/", category: "daily", tags: ["diagrams", "architecture"], desc: "Free online diagram software (great for network topology)." },
            { name: "Notepad++", url: "https://notepad-plus-plus.org/", category: "daily", tags: ["editor", "windows"], desc: "Free source code editor and Notepad replacement." }
        ];

        async function fetchGithubData() {
            const statusEl = document.getElementById('sync-status');
            statusEl.textContent = 'Syncing...';
            statusEl.className = '';

            try {
                const response = await fetch(`${GITHUB_RAW_URL}?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                toolsData = data;
                statusEl.textContent = '✓ Synced with GitHub';
                statusEl.className = 'status-ok';
            } catch (error) {
                toolsData = fallbackData;
                statusEl.textContent = '⚠ Using Offline Database (100+ Tools)';
                statusEl.className = 'status-err';
            }
            renderTabs();
            renderTools();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabs-container');
            tabsContainer.innerHTML = '';
            
            for (const [key, label] of Object.entries(categories)) {
                const btn = document.createElement('button');
                btn.className = `tab ${key === currentCategory ? 'active' : ''}`;
                btn.textContent = label;
                btn.onclick = () => {
                    currentCategory = key;
                    
                    const cvePanel = document.getElementById('cve-correlator');
                    const toolsSearch = document.getElementById('tools-search-container');
                    const toolsContainer = document.getElementById('tools-container');
                    
                    if (key === 'cve') {
                        cvePanel.style.display = 'block';
                        toolsSearch.style.display = 'none';
                        toolsContainer.style.display = 'none';
                    } else {
                        cvePanel.style.display = 'none';
                        toolsSearch.style.display = 'flex';
                        toolsContainer.style.display = 'grid';
                    }

                    renderTabs();
                    if(key !== 'cve') renderTools();
                };
                tabsContainer.appendChild(btn);
            }
        }

        function renderTools() {
            const container = document.getElementById('tools-container');
            const searchInput = document.getElementById('search-input').value.toLowerCase();
            container.innerHTML = '';
            
            const filteredTools = toolsData.filter(tool => {
                const matchesCategory = currentCategory === 'all' || tool.category === currentCategory;
                const matchesSearch = 
                    tool.name.toLowerCase().includes(searchInput) || 
                    tool.desc.toLowerCase().includes(searchInput) ||
                    (tool.tags && tool.tags.some(tag => tag.toLowerCase().includes(searchInput)));
                return matchesCategory && matchesSearch;
            });
            
            document.getElementById('tool-counter').textContent = `Showing ${filteredTools.length} tools`;

            if (filteredTools.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #8b949e;">No tools found.</p>';
                return;
            }

            filteredTools.forEach(tool => {
                const card = document.createElement('div');
                card.className = 'card';
                const tagsHtml = tool.tags ? tool.tags.map(tag => `<span class="badge">${tag}</span>`).join('') : '';
                
                card.innerHTML = `
                    <h3>${tool.name}</h3>
                    <div>${tagsHtml}</div>
                    <p>${tool.desc}</p>
                    <a href="${tool.url}" target="_blank" rel="noopener noreferrer">Launch Tool 🡕</a>
                `;
                container.appendChild(card);
            });
        }

        function generateCveLinks() {
            const input = document.getElementById('cve-input').value.trim().toUpperCase();
            const resultsDiv = document.getElementById('cve-results');
            
            const cveRegex = /^CVE-\d{4}-\d{4,7}$/;
            if (!cveRegex.test(input)) {
                resultsDiv.innerHTML = '<span style="color: var(--error);">Invalid format. Please use CVE-YYYY-NNNN</span>';
                return;
            }

            const links = [
                { name: "NIST NVD", url: `https://nvd.nist.gov/vuln/detail/${input}` },
                { name: "Exploit-DB", url: `https://www.exploit-db.com/search?cve=${input.split('-').slice(1).join('-')}` },
                { name: "GitHub PoC", url: `https://github.com/search?q=${input}+poc&type=repositories` },
                { name: "Vulners", url: `https://vulners.com/search?query=${input}` },
                { name: "Shodan", url: `https://www.shodan.io/search?query=vuln%3A${input}` }
            ];

            resultsDiv.innerHTML = links.map(l => 
                `<a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.name} 🡕</a>`
            ).join('');
        }

        window.onload = () => {
            fetchGithubData();
        };
    </script>
</body>
</html>
