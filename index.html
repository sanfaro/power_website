<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSec Ultimate Arsenal</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --success: #2ea043;
            --error: #f85149;
            --fav-color: #e3b341;
            --cve-bg: #1f2428;
        }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; line-height: 1.5; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { margin: 0; color: var(--accent-color); }
        
        .tabs { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;}
        .tab { padding: 10px 20px; border-radius: 20px; background-color: var(--panel-bg); color: var(--text-color); border: 1px solid var(--border-color); cursor: pointer; font-weight: 500; transition: 0.2s;}
        .tab:hover { background-color: var(--border-color); }
        .tab.active { background-color: var(--accent-color); color: #000; border-color: var(--accent-color); font-weight: bold; }
        
        .search-container { margin-bottom: 20px; display: flex; gap: 10px; align-items: center;}
        .search-box { width: 100%; padding: 12px; background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .counter { font-size: 0.9em; color: #8b949e; white-space: nowrap; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        .card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; transition: transform 0.2s; position: relative;}
        .card:hover { transform: translateY(-2px); border-color: #8b949e; }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .card h3 { margin: 0; color: var(--accent-color); font-size: 1.1em; }
        .fav-btn { background: none; border: none; color: #484f58; font-size: 1.5em; cursor: pointer; padding: 0; margin-left: 10px; transition: color 0.2s; }
        .fav-btn:hover { color: #8b949e; }
        .fav-btn.favorited { color: var(--fav-color); }

        .badge { display: inline-block; background: #238636; color: white; font-size: 0.7em; padding: 2px 6px; border-radius: 10px; margin-bottom: 10px; width: fit-content; margin-right: 4px; cursor: pointer;}
        .badge:hover { background: #2ea043; }
        .card p { margin: 0 0 16px 0; font-size: 0.85em; flex-grow: 1; color: #8b949e; }
        .card a { display: inline-block; text-align: center; background: #21262d; color: var(--accent-color); text-decoration: none; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 0.9em; }
        .card a:hover { background: #30363d; }

        .cve-panel { background: var(--cve-bg); border: 1px solid var(--accent-color); padding: 20px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .cve-input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .cve-links a { display: inline-block; background: #21262d; border: 1px solid var(--border-color); color: #c9d1d9; padding: 10px 15px; border-radius: 6px; text-decoration: none; margin: 5px; }

        .news-panel { display: none; }
        .news-item { background: var(--panel-bg); border-left: 4px solid var(--accent-color); padding: 12px 16px; margin-bottom: 10px; border-radius: 4px; }
        .news-item a { color: #c9d1d9; text-decoration: none; font-weight: 500; font-size: 1.1em; }
        .news-item a:hover { color: var(--accent-color); text-decoration: underline; }
        .news-date { font-size: 0.8em; color: #8b949e; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>CyberSec Ultimate Arsenal</h1>
        <div><span id="sync-status" style="font-size: 0.9em; font-weight: bold;"></span></div>
    </div>

    <div class="tabs" id="tabs-container"></div>

    <div id="cve-correlator" class="cve-panel">
        <h2 style="margin-top:0; color:var(--accent-color)">CVE Intelligence Correlator</h2>
        <div class="cve-input-group">
            <input type="text" id="cve-input" class="search-box" placeholder="e.g. CVE-2023-38545" onkeypress="if(event.key === 'Enter') generateCveLinks()">
            <button onclick="generateCveLinks()" style="padding:0 20px; background:var(--accent-color); border:none; border-radius:6px; cursor:pointer;"><b>Search</b></button>
        </div>
        <div class="cve-links" id="cve-results"></div>
    </div>

         <!-- Panel: Threat Intelligence Feed -->
    <div id="news-container" class="news-panel">
        <h2 style="margin-top:0; color:var(--accent-color)">Threat Intelligence Feed</h2>
        <p style="color:#8b949e">Latest vulnerabilities and active threats automatically categorized by sector.</p>
        
        <!-- Category Filters -->
        <div class="tabs" id="news-filters" style="border:none; padding-bottom:0; margin-bottom: 15px; gap: 8px;">
            <button class="tab active" onclick="filterNews('All')">All Threats</button>
            <button class="tab" onclick="filterNews('🖥️ OS & Systems')">OS & Systems</button>
            <button class="tab" onclick="filterNews('🌐 Network & Infra')">Network & Infra</button>
            <button class="tab" onclick="filterNews('🕸️ Web & Apps')">Web & Apps</button>
            <button class="tab" onclick="filterNews('☁️ Cloud & Hardware')">Cloud & Hardware</button>
        </div>

        <div id="news-feed">Gathering global threat telemetry...</div>
    </div>
        <div id="news-feed">Loading fresh intelligence...</div>
    </div>

    <div class="search-container" id="tools-search-container">
        <input type="text" id="search-input" class="search-box" placeholder="Search across 100+ tools, tags, or keywords..." oninput="renderTools()">
        <span class="counter" id="tool-counter">0 tools</span>
    </div>

    <div class="grid" id="tools-container"></div>

    <script>
        const GITHUB_RAW_URL = "https://raw.githubusercontent.com/sanfaro/power_website/refs/heads/main/tools.json";
        
        let toolsData = [];
        let currentCategory = 'all';
        let favorites = JSON.parse(localStorage.getItem('cyberFavs')) || [];

        const categories = {
            'all': 'All Tools',
            'favs': ' Favorites',
            'cve': ' CVE Correlator',
            'news': ' Live News',
            'repos': 'GitHub Repos',
            'osint': 'OSINT',
            'redteam': 'Red Team',
            'blueteam': 'Blue Team',
            'web': 'Web Security',
            'malware': 'Malware Analysis'
        };

        const fallbackData = [
            { "name": "Burp Suite", "url": "https://portswigger.net/burp", "category": "web", "tags": ["proxy", "scanner"], "desc": "Industry standard toolkit for web application security testing." },
            { "name": "OSINT Framework", "url": "https://osintframework.com", "category": "osint", "tags": ["framework"], "desc": "Web-based framework compiling various OSINT tools." },
            { "name": "Wazuh", "url": "https://wazuh.com", "category": "blueteam", "tags": ["siem", "xdr"], "desc": "Free, open-source security platform for threat detection." },
            { "name": "Sliver", "url": "https://github.com/BishopFox/sliver", "category": "redteam", "tags": ["c2", "golang"], "desc": "Open source cross-platform adversary emulation framework." },
            { "name": "Any.Run", "url": "https://any.run", "category": "malware", "tags": ["sandbox"], "desc": "Interactive online malware analysis sandbox." },
            { "name": "PayloadsAllTheThings", "url": "https://github.com/swisskyrepo/PayloadsAllTheThings", "category": "repos", "tags": ["payloads", "cheatsheet"], "desc": "List of useful payloads and bypasses." }
        ];

        async function initApp() {
            const statusEl = document.getElementById('sync-status');
            try {
                const response = await fetch(`${GITHUB_RAW_URL}?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('HTTP error');
                toolsData = await response.json();
                statusEl.textContent = '🟢 Database Synced';
                statusEl.style.color = 'var(--success)';
            } catch (error) {
                toolsData = fallbackData;
                statusEl.textContent = '🔴 Offline Mode (Using Backup DB)';
                statusEl.style.color = 'var(--error)';
            }
            renderTabs();
            renderTools();
        }

        function toggleFavorite(toolName) {
            if (favorites.includes(toolName)) {
                favorites = favorites.filter(name => name !== toolName);
            } else {
                favorites.push(toolName);
            }
            localStorage.setItem('cyberFavs', JSON.stringify(favorites));
            renderTools();
        }

        function filterByTag(tag) {
            document.getElementById('search-input').value = tag;
            renderTools();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabs-container');
            tabsContainer.innerHTML = '';
            
            for (const [key, label] of Object.entries(categories)) {
                const btn = document.createElement('button');
                btn.className = `tab ${key === currentCategory ? 'active' : ''}`;
                btn.textContent = label;
                btn.onclick = () => {
                    currentCategory = key;
                    
                    const cvePanel = document.getElementById('cve-correlator');
                    const newsPanel = document.getElementById('news-container');
                    const toolsSearch = document.getElementById('tools-search-container');
                    const toolsContainer = document.getElementById('tools-container');
                    
                    cvePanel.style.display = 'none';
                    newsPanel.style.display = 'none';
                    toolsSearch.style.display = 'none';
                    toolsContainer.style.display = 'none';

                    if (key === 'cve') {
                        cvePanel.style.display = 'block';
                    } else if (key === 'news') {
                        newsPanel.style.display = 'block';
                        fetchNews();
                    } else {
                        toolsSearch.style.display = 'flex';
                        toolsContainer.style.display = 'grid';
                    }

                    renderTabs();
                    if(key !== 'cve' && key !== 'news') renderTools();
                };
                tabsContainer.appendChild(btn);
            }
        }

        function renderTools() {
            const container = document.getElementById('tools-container');
            const searchInput = document.getElementById('search-input').value.toLowerCase();
            container.innerHTML = '';
            
            const filteredTools = toolsData.filter(tool => {
                let matchesCategory = false;
                if (currentCategory === 'all') matchesCategory = true;
                else if (currentCategory === 'favs') matchesCategory = favorites.includes(tool.name);
                else matchesCategory = tool.category === currentCategory;

                const matchesSearch = 
                    tool.name.toLowerCase().includes(searchInput) || 
                    tool.desc.toLowerCase().includes(searchInput) ||
                    (tool.tags && tool.tags.some(tag => tag.toLowerCase().includes(searchInput)));
                
                return matchesCategory && matchesSearch;
            });
            
            document.getElementById('tool-counter').textContent = `Showing ${filteredTools.length} tools`;

            if (filteredTools.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #8b949e;">No tools found in this section.</p>';
                return;
            }

            filteredTools.forEach(tool => {
                const isFav = favorites.includes(tool.name);
                const card = document.createElement('div');
                card.className = 'card';
                
                const tagsHtml = tool.tags ? tool.tags.map(tag => `<span class="badge" onclick="filterByTag('${tag}')">${tag}</span>`).join('') : '';
                
                card.innerHTML = `
                    <div class="card-header">
                        <h3>${tool.name}</h3>
                        <button class="fav-btn ${isFav ? 'favorited' : ''}" onclick="toggleFavorite('${tool.name}')" title="Add to favorites">
                            ${isFav ? '★' : '☆'}
                        </button>
                    </div>
                    <div>${tagsHtml}</div>
                    <p>${tool.desc}</p>
                    <a href="${tool.url}" target="_blank" rel="noopener noreferrer">Launch Tool 🡕</a>
                `;
                container.appendChild(card);
            });
        }

        let newsLoaded = false;
        async function fetchNews() {
            if(newsLoaded) return;
            const feedContainer = document.getElementById('news-feed');
            
            const rssUrl = "https://feeds.feedburner.com/TheHackersNews";
            const apiProxy = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
            
            try {
                const response = await fetch(apiProxy);
                const data = await response.json();
                
                feedContainer.innerHTML = '';
                data.items.slice(0, 10).forEach(item => {
                    const date = new Date(item.pubDate).toLocaleString();
                    feedContainer.innerHTML += `
                        <div class="news-item">
                            <a href="${item.link}" target="_blank">${item.title}</a>
                            <div class="news-date">🗓️ ${date} | Source: The Hacker News</div>
                        </div>
                    `;
                });
                newsLoaded = true;
            } catch(e) {
                feedContainer.innerHTML = '<span style="color:var(--error)">Error loading news feed. Try again later.</span>';
            }
        }

        function generateCveLinks() {
            const input = document.getElementById('cve-input').value.trim().toUpperCase();
            const resultsDiv = document.getElementById('cve-results');
            const cveRegex = /^CVE-\d{4}-\d{4,7}$/;
            if (!cveRegex.test(input)) { resultsDiv.innerHTML = '<span style="color: var(--error);">Invalid format. Use CVE-YYYY-NNNN</span>'; return; }
            const links = [
                { name: "NIST NVD", url: `https://nvd.nist.gov/vuln/detail/${input}` },
                { name: "Exploit-DB", url: `https://www.exploit-db.com/search?cve=${input.split('-').slice(1).join('-')}` },
                { name: "GitHub PoC", url: `https://github.com/search?q=${input}+poc&type=repositories` }
            ];
            resultsDiv.innerHTML = links.map(l => `<a href="${l.url}" target="_blank">${l.name} 🡕</a>`).join('');
        }

        window.onload = initApp;
    </script>
</body>
</html>
